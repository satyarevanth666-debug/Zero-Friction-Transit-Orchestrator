[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-friction-transit-backend"
version = "0.1.0"
description = "Deterministic zero-friction multi-modal transit orchestrator backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "authlib>=1.3.0",
    "dateparser>=1.2.0",
    "rapidfuzz>=3.6.0",
    "regex>=2024.4.16",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "hypothesis>=6.98.0",
    "freezegun>=1.4.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12.20240311",
    "types-dateparser>=1.2.0.20240420",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

